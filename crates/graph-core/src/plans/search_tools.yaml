version: 2
identifier: search_tools
name: Search tools
description: Finds the catalog tools a task needs by scoring every tool against it — with a decision model when one is configured, otherwise by keywords — and returns them highest score first.
input_schema:
  type: object
  required: [query]
  properties:
    query:
      type: string
      description: The task the tools are for
    min_confidence:
      type: number
      description: Minimum score for a tool to be returned
      default: 0.6
    limit:
      type: integer
      description: Most tools to return
      default: 20
    min_tools:
      type: integer
      description: Fewest tools to return, taking the best below the threshold when needed
      default: 5
    model:
      type: string
      description: The decision model role that scores the tools
      default: decider
    chunk_size:
      type: integer
      description: Most tools per decision request; larger catalogs are split into requests sent together
      default: 60
    schemas:
      type: boolean
      description: Include each tool's input schema and output shape
      default: true
steps:
  - id: catalog
    tool_name: builtin__catalog_tools
    input: {}
    reasoning: Every tool in the catalog with its description; always-loaded tools are left out.
  - id: picked
    tool_name: builtin__score_candidates
    input:
      query: "{{input.query}}"
      candidates: "{{catalog.tools}}"
      question: "Is the tool '{name}: {description}' needed for this task?"
      threshold: "{{input.min_confidence}}"
      floor: "{{input.min_tools}}"
      limit: "{{input.limit}}"
      model: "{{input.model}}"
      chunk_size: "{{input.chunk_size}}"
    reasoning: Each tool scored on its own; the ones that clear the threshold are returned, highest score first.
  - id: described
    tool_name: builtin__describe_tools
    input:
      tools: "{{picked.selected}}"
      schemas: "{{input.schemas}}"
    reasoning: The returned tools with their scores and, when asked, their schemas.
output:
  mode: "{{picked.mode}}"
  tools: "{{described.tools}}"
  always: "{{catalog.always}}"
