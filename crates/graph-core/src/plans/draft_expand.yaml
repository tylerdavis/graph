version: 1
identifier: draft_expand
name: Draft plan from outline
description: Turns an outline into validated plan steps, one outline entry at a time.
input_schema:
  type: object
  required: [goal, outline]
  properties:
    goal:
      type: string
      description: What the plan should accomplish
    outline:
      type: array
      items:
        type: string
      description: Outline entries, in order
    revising:
      type: string
      description: A draft plan being revised, as YAML; every step is regenerated
      default: ""
steps:
  - id: expand
    tool_name: reduce
    input:
      over: "{{input.outline}}"
      initial: { steps: [], solver: null, done: false, failed: false, problems: [], settled: false, correction: "" }
      do:
        tool_name: plan__draft_step
        input:
          goal: "{{input.goal}}"
          outline: "{{input.outline}}"
          entry: "{{item}}"
          state: "{{accumulator}}"
          revising: "{{input.revising}}"
    reasoning: One validated step per outline entry; the state carries accepted steps forward.
  - id: close
    tool_name: plan__draft_step
    input:
      goal: "{{input.goal}}"
      outline: "{{input.outline}}"
      entry: ""
      state: "{{expand.result}}"
      revising: "{{input.revising}}"
    reasoning: Finishes the plan, or confirms it is complete, once every entry has been advanced.
output:
  steps: "{{close.steps}}"
  solver: "{{close.solver}}"
  done: "{{close.done}}"
  failed: "{{close.failed}}"
  problems: "{{close.problems}}"
