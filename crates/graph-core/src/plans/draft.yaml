version: 1
identifier: draft
name: Draft a plan
description: Outlines a goal, then expands the outline into a validated plan.
input_schema:
  type: object
  required: [goal]
  properties:
    goal:
      type: string
      description: What the plan should accomplish
steps:
  - id: outline
    tool_name: plan__draft_outline
    input:
      goal: "{{input.goal}}"
  - id: plan
    tool_name: plan__draft_expand
    input:
      goal: "{{input.goal}}"
      outline: "{{outline.entries}}"
output:
  outline: "{{outline.entries}}"
  steps: "{{plan.steps}}"
  solver: "{{plan.solver}}"
  done: "{{plan.done}}"
  failed: "{{plan.failed}}"
  problems: "{{plan.problems}}"
