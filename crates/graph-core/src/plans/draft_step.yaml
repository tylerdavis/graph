version: 2
identifier: draft_step
name: Draft plan step
description: Drafts the plan step that advances one outline entry, retrying with the validation problems.
input_schema:
  type: object
  required: [goal, outline, state]
  properties:
    goal:
      type: string
      description: What the plan should accomplish
    outline:
      type: array
      items:
        type: string
      description: The whole outline, in order
    entry:
      type: string
      description: The outline entry this step advances; empty to finish the plan
      default: ""
    state:
      type: object
      description: The drafting state so far
steps:
  - id: found
    tool_name: route
    input:
      if: { value: "{{input.state.done}}", op: eq, to: false }
      then:
        tool_name: plan__search_tools
        input:
          query: "{{input.goal}}\n\n{{input.entry}}"
          schemas: false
      else:
        tool_name: builtin__reshape
        input:
          shape: { tools: [] }
    reasoning: The tools this outline entry needs, so the step sees those instead of the whole catalog; skipped once the plan is done.
  - id: context
    tool_name: builtin__draft_context
    input:
      goal: "{{input.goal}}"
      outline: "{{input.outline}}"
      entry: "{{input.entry}}"
      state: "{{input.state}}"
      tools: "{{found.result.tools}}"
    reasoning: The step request, the attempt numbers, the step-response schema, and the searched tools and rules the drafting prompt is built from.
  - id: prompt
    tool_name: builtin__reshape
    input:
      shape:
        system: |
          # Tool-Based Task Execution Framework

          ## Overview
          You are tasked with creating a step-by-step plan to solve problems using the tools listed below. Each step must use one of the defined tools; the plan is executed as a program, and the results its steps collect are what the plan produces. A plan finishes in one of three ways: a solver LLM synthesizing the collected results into an answer, a structured `output` map built from templates, or nothing at all when the plan exists for its side effects. You draft the plan one step per request, following an outline sketched beforehand.

          ## Context Variables
          - Current Date: {{context.date}}

          ## Tools Available
          Each request lists the tools available for that step, with their schemas. Use only those tools and the control steps.

          ## Template Rules
          {{context.templating_rules}}

          ## Current User Context
          <current_user_context>
          {{context.user}}
          </current_user_context>

          ## Plan Structure
          ### Step Schema
          Each step must conform to:
          <step>
          {{context.step_schema}}
          </step>

          Step IDs are identifiers (letters, digits, _; not starting with a digit), unique across the plan, and never `input`, `item`, `index`, `accumulator`, or `length`. Each step request names the ID to use.

          ### Drafting Protocol
          1. The task arrives with an OUTLINE: an ordered list of entries, each a brief on one stage of a system that solves the task. It was sketched from tool names alone, so it is directional, not a contract: one entry may take several steps, several entries may collapse into one step, and an entry that no available tool can serve should be adapted to what the catalog actually offers — or skipped.
          2. Steps are requested ONE at a time, each request naming the step id to use and the outline entry it advances. Emit exactly one step per request; you see the outline and every previously accepted step.
          3. A control step (`agent`, `route`, `filter`, `map`, or `reduce`) is ONE step — its body nests inside that single step's input.
          4. When the plan finishes with a solver, set `queryToAnswer` (always including the user's original task) and optionally `systemPrompt` on your FIRST step response; a later response may set them again to refine them. Omit both for a plan that finishes with an `output` map or exists only for its side effects.
          5. Set `planComplete` to true on the step that finishes the plan. When the already-accepted steps complete the plan on their own, return `step: null` with `planComplete: true` instead of inventing a filler step.
          6. When a step is reported invalid, produce a corrected step for the SAME position, using the id you were given. Never re-emit accepted steps — they are immutable.

          ## Core Rules

          ### Tool Usage
          1. Use exact tool names as listed.
          2. Only reference output fields that appear in a tool's output schema or observed output shape. If a tool's output shape is unknown, reference the whole result (the step id alone, with no field path).
          3. Never assume a tool returned data: prefer whole-result references and let the solver handle emptiness, or use narrow filters so emptiness is meaningful.

          {{context.planning_rules}}

          {{context.control_step_rules}}
    reasoning: The step-drafting system prompt, identical for every step and attempt so the provider caches it.
  - id: attempts
    tool_name: reduce
    input:
      over: "{{context.attempts}}"
      initial: "{{context.state}}"
      do:
        - id: attempt
          tool_name: route
          input:
            if: { value: "{{accumulator.settled}}", op: eq, to: false }
            then:
              - id: draft
                tool_name: builtin__infer
                input:
                  model: planner
                  system: "{{prompt.system}}"
                  instruction: "{{context.request}}\n\n## Tools for this step\n{{context.tools}}\n\n{{accumulator.correction}}"
                  output_schema: "{{context.draft_schema}}"
              - id: accepted
                tool_name: builtin__accept_step
                input:
                  state: "{{accumulator}}"
                  draft: "{{draft}}"
                  attempt: "{{item}}"
            else:
              tool_name: builtin__reshape
              input:
                shape: "{{accumulator}}"
        - id: next
          tool_name: builtin__reshape
          input:
            shape: "{{attempt.result}}"
    reasoning: Each attempt drafts and validates the step until one is accepted, feeding a rejected step's problems to the next; once the entry is settled the rest pass the state through.
output:
  steps: "{{attempts.result.steps}}"
  solver: "{{attempts.result.solver}}"
  done: "{{attempts.result.done}}"
  failed: "{{attempts.result.failed}}"
  problems: "{{attempts.result.problems}}"
  settled: "{{attempts.result.settled}}"
  correction: "{{attempts.result.correction}}"
