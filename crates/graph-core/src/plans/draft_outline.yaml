version: 2
identifier: draft_outline
name: Draft outline
description: Writes the coarse, whiteboard-level outline of a plan for a goal.
input_schema:
  type: object
  required: [goal]
  properties:
    goal:
      type: string
      description: What the plan should accomplish
steps:
  - id: catalog
    tool_name: builtin__catalog_outline
    input: {}
    reasoning: The sectioned summary of what the plan can use.
  - id: outline
    tool_name: builtin__infer
    input:
      model: outliner
      instruction: |
        You are a principal engineer beginning the process of developing the solution to a specific task. Your job is to write the first, coarse outline of a system that can solve the task. The system should use concurrency and parallelism as much as possible to not only reduce the overall time complexity, but also keep sub-agent and inference context as small and focused as possible. Use inference only when necessary. Your outline should be high level. We're not writing pseudo code. We're describing the overall control flow of a system and roughly what types of tools or data you'd need to solve the task. Just keep it simple. This should be similar to what you'd put up on a whiteboard working a problem.

        ## Control steps
        - `exit`: ends the plan early, as a success or an error, when a condition holds or a judgment says so.
        - `route`: picks one of its branches from a condition or a judgment, or one of several named cases when a decision model chooses.
        - `filter`: keeps the items of a list that pass a condition or a per-item judgment; judgments can run in parallel.
        - `map`: runs the same work once per item of a list, optionally in parallel.
        - `reduce`: folds a list into a single value, one item at a time.
        - `agent`: hands an open-ended subtask to a bounded tool-calling loop.
        - `ask`: gets a value that only the user can provide.

        ## Outline
        - Write an ordered list of entries, one per action, in the order the actions run.
        - Each entry is one sentence describing one action against one system or capability: one fetch, one transform, one judgment, or one write. If a stage does two things (fetches from two systems, fetches then reshapes, reduces then exits), write two entries.
        - Commit to one approach per entry. No "or", "optionally", or alternatives in parentheses. If the system must choose at run time, write that choice as its own route entry.
        - Your outline should be terse and direct, without writing code.  This is a system design exercise, not a development exercise
        - Bring precision where it counts: data flow, concurrent/parallel processing, using inference where appropriate
        - inference is expensive.  llm tokens are expensive.  We should always try to optimize the context we pass into an inference step to ensure fast, affordable inference
        - When work fans out per item, write the fan-out as its own entry, naming the list and the single action each item gets (for example "For each project, in parallel, fetch its issues from Linear").
        - Say where the system branches or stops early.
        - Describe what each stage does and which system or kind of capability it uses (for example Linear, GitHub, Slack, inference, or reshaping data).

        # Goal
        {{input.goal}}

        {{catalog.text}}
      output_schema:
        type: object
        required: [entries]
        properties:
          entries:
            type: array
            items:
              type: string
            description: The plan's actions in the order they run, each a one-sentence brief on one action against one system or capability
    reasoning: One isolated inference on the outliner role; it sees the goal and the catalog summary, never tool schemas.
output:
  entries: "{{outline.entries}}"
