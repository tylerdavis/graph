version: 2
identifier: compose_plan
name: Compose plan
description: Drafts a whole plan for a goal in one call, from the tools search finds for each capability it needs, then fixes only the steps that fail validation. Stops before drafting when a capability has no tool.
input_schema:
  type: object
  required: [goal]
  properties:
    goal:
      type: string
      description: What the plan should accomplish
    needs_model:
      type: string
      default: outliner
      description: The model role that lists the plan's inputs and capabilities
    model:
      type: string
      default: planner
      description: The model role that writes and fixes the plan
steps:
  - id: needs
    tool_name: builtin__infer
    input:
      model: "{{input.needs_model}}"
      system: |-
        You sketch a small automation before its steps are written. Given a goal, list three things.

        inputs: the values the person running it supplies each time, each with a snake_case name, a JSON type and a one-line description. Only values the goal leaves open, such as "a release tag" or "a pull request". None when the goal names everything. Use integer for numbers such as a pull request number, and string for names, tags, keys and identifiers.

        capabilities: the actions it performs, in order, each one action in one system.
        - kind data: fetching, looking up, searching or writing something in a system. Say what and where, for example "Fetch the commits between two release tags from git" or "Fetch a Linear issue's comments".
        - kind judgment: summarizing, grouping by meaning, classifying, or writing prose. Only when the goal asks for prose, a summary, a classification or a decision; finding, listing or fetching needs none, and never add one to double-check what a tool returned.
        - kind control: doing something for each item, keeping only some items, counting, or stopping early. Only the fan-out, selection or stop itself: anything that has to be looked up, even a single value such as a release's previous tag or an id for a name, is a data capability of its own.
        Usually two to four capabilities, never more than six. No validation, review, normalization, formatting or logging capabilities.

        details: every specific the goal states that a step must honor, each as a short phrase: an identifier format ("Linear ticket ids look like LN-123"), a scope ("only files under crates/"), a state or label ("issues in the Needs verification state"), what the answer must include ("the issue's title and description as well as its comments"). Empty when there are none.
      instruction: "{{input.goal}}"
      output_schema:
        type: object
        required: [inputs, capabilities, details]
        properties:
          details:
            type: array
            items: { type: string }
          inputs:
            type: array
            items:
              type: object
              required: [name, type, description]
              properties:
                name: { type: string }
                type: { type: string }
                description: { type: string }
          capabilities:
            type: array
            items:
              type: object
              required: [does, kind]
              properties:
                does: { type: string }
                kind: { type: string, enum: [data, judgment, control] }
  - id: data
    tool_name: filter
    input:
      over: "{{needs.capabilities}}"
      where: { value: "{{item.kind}}", op: eq, to: data }
  - id: found
    tool_name: map
    input:
      over: "{{data.items}}"
      concurrency: 8
      do:
        - id: search
          tool_name: plan__search_tools
          input:
            query: "{{item.does}}"
            schemas: false
        - id: pair
          tool_name: builtin__reshape
          input:
            shape:
              does: "{{item.does}}"
              tools: "{{search.tools}}"
  - id: gaps
    tool_name: filter
    input:
      over: "{{found.results}}"
      where: { value: "{{item.tools}}", op: empty }
  - id: stop
    tool_name: exit
    input:
      when: { value: "{{gaps.count}}", op: gt, to: 0 }
      status: success
      message: "No tool in the catalog can do: {{gaps.items}}"
      output:
        needs: "{{needs}}"
        plan: null
        valid: false
        problems: []
        yaml: null
        questions: []
        missing: "{{gaps.items}}"
  - id: context
    tool_name: builtin__compose_context
    input:
      found: "{{found.results}}"
  - id: prompt
    tool_name: builtin__reshape
    input:
      shape:
        system: |-
          You compose graph plans: YAML documents that run tool calls as a program. Write the whole plan for the goal in one response.

          {{context.composing_rules}}

          ## Template rules
          {{context.templating_rules}}

          ## Step schema
          {{context.step_schema}}

          ## Tools every plan can use
          {{context.standing_tools}}
  - id: draft
    tool_name: builtin__infer
    input:
      model: "{{input.model}}"
      system: "{{prompt.system}}"
      instruction: |-
        # Goal
        {{input.goal}}

        # Inputs the user supplies each run
        {{needs.inputs}}

        # Capabilities, in order
        {{needs.capabilities}}

        # Details the plan must honor, each as a tool argument or in what the plan fetches
        {{needs.details}}

        # Tools found for these capabilities
        {{context.tools}}

        Write the plan as YAML in `yaml`.

        List in `questions` each value the plan uses that you had to guess because neither the goal, the inputs nor the tools' schemas pin it down, and that decides which items the plan returns: a status, project or label name, a threshold, a scope. Use your guess in the plan. Don't ask about a value the goal states (use it as written), a limit or size that only bounds how much is fetched, or how to do something the tools can't do. Each question is one short sentence to the person who asked for the plan ("Which workflow state means in progress?"), and its guess is exactly the value the plan uses, as written in the plan ("started"), with no explanation. `questions` goes beside `yaml` in your response, never inside the plan. Leave it empty when nothing is a guess.

        When part of the plan needs a tool you weren't shown, describe what that tool should do in `search`, one entry per tool ("List the workflow states of a Linear team"), and write the rest of the plan; you'll see what the search finds before the plan is finished. Leave `search` empty when the tools shown are enough.
      output_schema:
        type: object
        required: [yaml, questions, search]
        properties:
          yaml: { type: string, description: The whole plan file as YAML }
          questions:
            type: array
            default: []
            description: Values you guessed, as questions for the person who asked for the plan
            items:
              type: object
              required: [key, question, guess]
              properties:
                key: { type: string, description: A snake_case name for the value }
                question: { type: string, description: One short question asking for it }
                guess: { type: string, description: Exactly the value the plan uses now, nothing else }
                options: { type: array, items: { type: string }, description: The allowed values, only when a tool's schema lists them }
          search:
            type: array
            default: []
            items: { type: string }
            description: What each tool you need but weren't shown should do; empty when the tools shown are enough
      on_mismatch: return
  - id: form
    tool_name: builtin__question_form
    input:
      draft: "{{draft}}"
  - id: clarify
    tool_name: route
    input:
      if: { value: "{{form.count}}", op: gt, to: 0 }
      then:
        - id: asked
          tool_name: ask
          input:
            prompt: "A few things to settle before the plan for \"{{input.goal}}\" is finished."
            output_schema: "{{form.schema}}"
            when_unanswered: default
            default: "{{form.default}}"
        - id: heard
          tool_name: builtin__reshape
          input:
            shape:
              answered: "{{asked.answered}}"
              said:
                asked: "{{form.questions}}"
                answers: "{{asked.answer}}"
      else:
        tool_name: builtin__reshape
        input:
          shape:
            answered: false
            said: Nothing was asked.
  - id: checked
    tool_name: builtin__check_plan
    input:
      yaml: "{{draft.yaml}}"
      search: "{{draft.search}}"
      pending: "{{clarify.result.answered}}"
  - id: start
    tool_name: builtin__reshape
    input:
      shape:
        check: "{{checked}}"
        search: "{{checked.search}}"
        found: "{{found.results}}"
        tools: "{{context.tools}}"
  - id: fixed
    tool_name: reduce
    input:
      over: "{{context.rounds}}"
      initial: "{{start}}"
      do:
        - id: round
          tool_name: route
          input:
            if: { value: "{{accumulator.check.settled}}", op: eq, to: false }
            then:
              - id: tooling
                tool_name: route
                input:
                  if: { value: "{{accumulator.search}}", op: not_empty }
                  then:
                    tool_name: builtin__find_tools
                    input:
                      queries: "{{accumulator.search}}"
                      found: "{{accumulator.found}}"
                  else:
                    tool_name: builtin__reshape
                    input:
                      shape:
                        found: "{{accumulator.found}}"
                        tools: "{{accumulator.tools}}"
              - id: fix
                tool_name: builtin__infer
                input:
                  model: "{{input.model}}"
                  system: "{{prompt.system}}"
                  instruction: |-
                    # Goal
                    {{input.goal}}

                    # Tools found for this plan
                    {{tooling.result.tools}}

                    # The plan
                    {{accumulator.check.yaml}}

                    # Its problems
                    {{accumulator.check.problems}}

                    # What the person who asked for the plan said
                    {{clarify.result.said}}

                    Make the plan follow what the person said and fix its problems; never fix a problem by dropping something they asked for. Where an answer is a value, put it where the plan used the guess. Where an answer says a value changes from run to run, make it a plan input in `input_schema`, or an `ask` step when it can only be chosen after earlier steps run. Follow `instructions` when given. When a change needs a tool that isn't listed above, describe what it should do in `search` and leave that change for the next round.

                    Return `patch`: a YAML mapping with `steps` holding a list of only the steps you replace (matched by id; a new step takes `after: <id of the step before it>`), `remove` with ids of steps to drop if any, and `input_schema` or `finish` only if they change. Return an empty patch when nothing needs to change.
                  output_schema:
                    type: object
                    required: [patch, search]
                    properties:
                      patch: { type: string, description: The YAML patch }
                      search:
                        type: array
                        default: []
                        items: { type: string }
                        description: What each tool you need but weren't shown should do; empty when the tools listed are enough
                  on_mismatch: return
              - id: patched
                tool_name: builtin__check_plan
                input:
                  yaml: "{{accumulator.check.yaml}}"
                  patch: "{{fix.patch}}"
                  search: "{{fix.search}}"
              - id: carried
                tool_name: builtin__reshape
                input:
                  shape:
                    check: "{{patched}}"
                    search: "{{patched.search}}"
                    found: "{{tooling.result.found}}"
                    tools: "{{tooling.result.tools}}"
            else:
              tool_name: builtin__reshape
              input:
                shape: "{{accumulator}}"
        - id: next
          tool_name: builtin__reshape
          input:
            shape: "{{round.result}}"
finish:
  output:
    needs: "{{needs}}"
    plan: "{{fixed.result.check.plan}}"
    valid: "{{fixed.result.check.valid}}"
    problems: "{{fixed.result.check.problems}}"
    yaml: "{{fixed.result.check.yaml}}"
    questions: "{{form.questions}}"
    missing: []
