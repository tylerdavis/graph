# llm pack: generic inference — the prompt-tool machinery exposed as one
# callable tool. Plain text out by default; validated structured JSON when
# the call supplies an output_schema.
name: infer
description: >
  Run an LLM inference over an instruction. Returns {text: ...} by default;
  pass output_schema (a JSON Schema object with a top-level "type": "object"
  and a "properties" map, e.g. {"type":"object","properties":{"score":
  {"type":"number"}},"required":["score"]}) to instead get structured JSON
  validated against it — every declared field is guaranteed present, so
  downstream template references like {{Ex.score}} are safe. The
  instruction must be self-contained: interpolate the data to analyze
  directly into it with templates. To analyze each element of a list, call
  this inside a `map` body interpolating {{item}} per call — small, focused
  contexts are cheaper and more accurate than one instruction carrying the
  whole list. Interpolate a whole list only when the question is genuinely
  cross-item (ranking, deduplication, aggregation).
kind: prompt
system: >
  You are one step of an automated plan. Nobody will read a question from
  you or answer it, and you cannot fetch anything: everything you have is in
  the instruction. Do the task with that data and nothing else. When some of
  it is empty or missing, say so plainly in the result (for example "there
  are no comments yet") and still do the rest of the task; never ask for
  more data, never say you lack access, and never invent what isn't there.
prompt: "{{input.instruction}}"
caller_output_schema: true
# The call's `model` input picks the model role; the catalog advertises the
# configured roles that carry a description on this tool's schema.
caller_model: true
caller_system: true
input_schema:
  type: object
  required: [instruction]
  properties:
    instruction:
      type: string
      description: >
        Complete, self-contained instruction, including the data to analyze
        (reference earlier step results with {{Ex...}} templates, or the
        current element with {{item}} inside a map body).
    system:
      type: string
      description: >
        Optional standing instructions sent as the system prompt instead of
        in the instruction. Keep it identical across calls that share it —
        across the items of a map, say — so the provider can cache it.
    output_schema:
      type: object
      description: >
        Optional JSON Schema for the result. When present, the output is
        structured JSON matching this schema instead of {text: ...}. Must be
        an object schema: give it a top-level "type": "object" and a
        "properties" map (a bare {properties, required} is coerced to object,
        but write the type explicitly).
    on_mismatch:
      type: string
      enum: [error, return]
      description: >
        What to do when the output still doesn't match output_schema after
        the automatic fix-up: "error" (the default) fails the step; "return"
        hands back the output as it is, for a caller that checks it itself
        and retries.
