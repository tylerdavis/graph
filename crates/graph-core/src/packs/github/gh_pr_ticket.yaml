# github pack: ticket ID from PR metadata, deterministically (regex, zero
# LLM calls). Scans the head branch name, then the title, then the body;
# the first match wins and is normalized to uppercase-with-dash
# (ln-1234 → LN-1234). Without a pattern, branch names match
# case-insensitively (ln-1234, LN-1234/topic) but titles and bodies only
# match an uppercase key, a dash and digits: prose such as "every 2 hours"
# or "up to 3" must not become EVERY-2 or TO-3, and standard names such as
# UTF-8 or SHA-256 are skipped. Every output field is always present so
# template references never dangle; no match is {found: false}, not an
# error.
name: gh_pr_ticket
description: >
  Extract a ticket identifier (e.g. LN-1234) from a pull request's head
  branch name, title, or body — scanned in that order, first match wins,
  normalized to uppercase-with-dash form. Deterministic regex extraction,
  no LLM call. Returns {found, ticket, source} with every field always
  present; a PR without a ticket is {found: false, ticket: null,
  source: null}, not an error.
kind: exec
command: bash
args:
  - "-ceu"
  - |
    pr="$1"; pattern="$2"
    standard='^(UTF|SHA|ISO|RFC|HTTP|TLS|SSL|UTC|GMT|CVE|ES|IPV|MD|AES|RSA|PEP)-'
    meta=$(gh pr view "$pr" --json headRefName,title,body)
    for source in branch title body; do
      case "$source" in
        branch) field=headRefName; default='[A-Za-z]{2,6}-[0-9]+' ;;
        title)  field=title; default='[A-Z]{2,6}-[0-9]+' ;;
        body)   field=body; default='[A-Z]{2,6}-[0-9]+' ;;
      esac
      text=$(jq -r --arg f "$field" '.[$f] // ""' <<<"$meta")
      if [ -n "$pattern" ]; then
        match=$(grep -oE "$pattern" <<<"$text" | head -n1 || true)
      else
        match=$(grep -oE "(^|[^A-Za-z0-9])$default([^0-9]|$)" <<<"$text" \
          | grep -oE "$default" | grep -viE "$standard" | head -n1 || true)
      fi
      if [ -n "$match" ]; then
        ticket=$(printf '%s' "$match" | tr '[:lower:]' '[:upper:]' \
          | sed -E 's/^([A-Z]+)[- ]?([0-9]+)$/\1-\2/')
        jq -n --arg ticket "$ticket" --arg source "$source" \
          '{found: true, ticket: $ticket, source: $source}'
        exit 0
      fi
    done
    echo '{"found": false, "ticket": null, "source": null}'
  - gh_pr_ticket
  - "{{input.pr}}"
  - "{{input.pattern}}"
output: json
timeout_secs: 30
read_only: true
input_schema:
  type: object
  required: [pr]
  properties:
    pr: { type: integer, description: Pull request number }
    pattern:
      type: string
      default: ""
      description: >
        POSIX extended regex the ticket ID must match, applied to the
        branch, title and body alike. Empty (the default) matches a tracker
        key and number joined by a dash: case-insensitively in the branch
        name (ln-1234), and only as uppercase (LN-1234) in the title and
        body, skipping standard names such as UTF-8 and SHA-256. Pass a
        project-specific pattern (e.g. "LN-[0-9]+") for tighter matching.
output_schema:
  type: object
  properties:
    found:  { type: boolean }
    ticket: { type: ["string", "null"], description: Normalized uppercase-with-dash ID, null when not found }
    source: { type: ["string", "null"], description: Where the match came from — branch, title, or body; null when not found }
