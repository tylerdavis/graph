[package]
name = "graph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graph"
path = "src/main.rs"

[dependencies]
graph-core.workspace = true
graph-llm.workspace = true
graph-mcp.workspace = true
graph-store.workspace = true
graph-config.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
reedline = "0.36"
chrono.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
tokio-util = "0.7"
futures.workspace = true
# TUI stack for `graph workbench` — crossterm pinned to reedline's 0.28 so
# the lockfile carries exactly one copy.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
# Workbench filesystem research tools (read_file / grep / glob).
ignore = "0.4"
globset = "0.4"
regex = "1"
# graph as an MCP *server* (`graph mcp serve`). graph-mcp holds the client
# half; the server lives here because what it serves is this crate's command
# layer. Feature-unified with graph-mcp's client build.
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-io",
    # `ask` steps become elicitation/create requests back to the client
    # (mcp_server/elicit.rs).
    "elicitation",
] }
schemars = "1"
uuid.workspace = true
reqwest = { version = "0.13", default-features = false }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = [
    "trace",
    "logs",
    "internal-logs",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "trace",
    "logs",
    "internal-logs",
    "http-proto",
    "http-json",
    "reqwest-client",
    "reqwest-rustls",
] }
opentelemetry-appender-tracing = "0.33"

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
# Scenario screenshots validate scripted tool outcomes against the real
# output schemas (workbench/shots.rs).
jsonschema = "0.26"
