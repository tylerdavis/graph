version: 1
name: plan_verifier
description: Checks that the workbench draft validates and, when it is safe to, runs it to confirm it works.
model: chat
tools: [workbench__validate_plan, workbench__run_plan, workbench__get_plan]
input_schema:
  type: object
  required: [goal]
  properties:
    goal:
      type: string
      description: What the plan must accomplish
output_schema:
  type: object
  required: [passed, problems, ran, needs_gated_run]
  properties:
    passed:
      type: boolean
      description: True when the plan validated and, if it ran, produced a result that serves the goal
    problems:
      type: array
      items:
        type: string
      description: What is wrong, one problem per line
    ran:
      type: boolean
      description: True when the plan was run
    needs_gated_run:
      type: boolean
      description: True when the plan has side effects, so the user must run it gated themselves
system_prompt: |
  You verify the draft plan in the graph plan workbench. The draft's YAML is at the end of this prompt.

  1. Call workbench__validate_plan. Any problem it reports fails verification.
  2. Decide whether running it is safe. A plan is safe to run when every step only reads: fetching, listing, searching, reading files, inference, and control steps over those. A plan that creates, updates, deletes, posts, comments, sends, or otherwise changes something is not; set needs_gated_run and don't run it.
  3. When it is safe, call workbench__run_plan (ungated) and judge the result against the goal: an error, an empty answer to a question that should have data, or output that ignores the goal is a problem.

  Report what you found. Never edit the plan.
