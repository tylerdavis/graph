# git-cliff configuration — changelog from conventional commits.
# https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to graph. Generated from conventional commits by git-cliff.
"""
body = """
{% if version %}
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Two classes of commit land on main without being authored by anyone here:
# merge commits, and the Mintlify app's write-back commits. They carry no
# changelog content, but under filter_unconventional they surfaced as
# "N commit(s) were skipped due to parse error(s)" — a warning that grew with
# every merge-button PR and drowned out genuinely malformed subjects.
# Preprocessors run before conventional parsing, so rewriting them into
# conventional form lets the existing skip parsers drop them silently. Anything
# else unconventional still warns, which is the point.
commit_preprocessors = [
  { pattern = "^Merge (pull request|branch|branches|remote-tracking branch|main|origin)\\b.*", replace = "chore(merge): ignored" },
  { pattern = "^Updated mintlify pages.*", replace = "chore(mintlify): ignored" },
]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Changed" },
  { message = "^test", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^ci|^style", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
