# git-cliff configuration — the commit skeleton of the docs changelog,
# rendered as Mintlify <Update> components from the same conventional
# commits as CHANGELOG.md. scripts/docs-changelog.sh runs this and then
# splices the committed changelog.d/<version>/ snippets (inferred
# summary, migration prompt) into the summary:/migration: markers below;
# scripts/release.sh drives both on every release, so the published page
# is in lockstep with the tags by construction — never edit
# docs/changelog.mdx by hand.
#
# The [git] section must stay aligned with cliff.toml: the two changelogs
# are one dataset in two renderings.

[changelog]
header = """
---
title: "Changelog"
icon: "clock-rotate-left"
rss: true
---

"""
# Unreleased commits are deliberately absent ({% if version %}): the docs
# publish released behavior only. The replace() filters keep MDX safe:
# < and { in a commit subject would otherwise parse as JSX.
body = """
{% if version %}
<Update label="{{ version }}" description="{{ timestamp | date(format="%B %-d, %Y") }}">
<!-- summary:{{ version }} -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | replace(from="<", to="&lt;") | replace(from="{", to="&#123;") }}
{%- endfor %}
{% endfor %}
<!-- migration:{{ version }} -->
</Update>
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Changed" },
  { message = "^test", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore|^ci|^style", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
