- id: release_notes
  goal: Write release notes for a release tag, grouped by theme, from the pull requests merged since the previous release and any Linear tickets (like LN-123) they reference.
  inputs: { tag: v0.15.0 }
  reference: ref_release_notes
  rubric: Release notes for v0.15.0 only, grouped into a few themes, each theme describing what changed and why it matters, drawn from the commits between v0.14.0 and v0.15.0. No invented changes or tickets.

- id: pr_summary
  goal: Summarize what a pull request changes and why.
  inputs: { pr: 144 }
  reference: ref_pr_summary
  rubric: A short summary of pull request 144 (tool search for plan drafting), naming its main changes and their purpose, consistent with its title, description and diff.

- id: pr_ticket_status
  goal: Report the status of the Linear ticket (like LN-123) a pull request implements, or say the pull request references no ticket.
  inputs: { pr: 143 }
  reference: ref_pr_ticket_status
  rubric: States that pull request 143 references no Linear ticket. Must not invent a ticket.

- id: pr_changed_files
  goal: List the files a pull request changed under a given path.
  inputs: { pr: 144, path: crates/graph-core/ }
  reference: ref_pr_changed_files
  check: { kind: set, reference_field: files, pattern: 'crates/graph-core/[A-Za-z0-9_./-]*[A-Za-z0-9]' }
  rubric: The files under crates/graph-core/ that pull request 144 changed, with their change status. No files outside that path.

- id: issue_discussion
  goal: Summarize the discussion on a Linear issue.
  inputs: { issue: LN-9418 }
  reference: ref_issue_discussion
  rubric: A summary of LN-9418 grounded in its title, description and comments; if it has no comments, says so rather than inventing discussion.

- id: project_progress
  goal: Report the progress of a Linear project, with milestone completion and the issues still open.
  inputs: { project: Embed Enhancements }
  reference: ref_project_progress
  rubric: Progress of the Embed Enhancements project consistent with its milestones and issues, naming open issues and how far each milestone is.

- id: issues_awaiting_verification
  goal: List the issues in a Linear project that are in the Needs verification state, with their titles and links.
  inputs: { project: Portfolio Hub v1 — Cotality }
  reference: ref_issues_awaiting_verification
  check: { kind: set, reference_field: issues, pattern: 'LN-[0-9]+' }
  rubric: Exactly the project's issues in the Needs verification state, each with title and link.

- id: commits_by_author
  goal: Summarize the commits since a release tag, grouped by author.
  inputs: { tag: v0.15.0 }
  reference: ref_commits_by_author
  rubric: Every author with commits after v0.15.0, each with a summary of their commits. No commits from before the tag.

- id: config_key_reads
  goal: Find every place in the crates that mentions a given config key, with file and line.
  inputs: { key: always_loaded }
  reference: ref_config_key_reads
  check: { kind: set, reference_field: matches, pattern: 'crates/[A-Za-z0-9_./-]*[A-Za-z0-9]' }
  rubric: The file and line of each occurrence of always_loaded under crates/.

- id: github_bug_issues
  goal: List the GitHub issues labeled bug that were opened this week.
  inputs: {}
  reference: null
  rubric: No plan. The planner reports that no tool lists GitHub issues and asks whether to add an MCP server or draft a tool.

- id: pr_review
  goal: Review the changes between two git refs against the repository's own invariants in CLAUDE.md, reading the changed Rust files in full alongside a wide-context diff. Stop early when there is nothing to review. Return only findings that are verified defects, each with file and line, and the number of them that are blockers.
  inputs: { base: v0.14.0, head: v0.15.0 }
  reference: ref_pr_review
  check: { kind: review, reference_field: data_changed_files }
  rubric: Findings only about files changed between v0.14.0 and v0.15.0, each with a file and line and grounded in that diff, plus a blocker count that equals the number of returned findings marked as blockers. Reviews differ from run to run, so the findings need not match the reference's; an empty list is acceptable. Judge the form and grounding, not agreement with the reference's findings.

- id: commits_without_docs
  goal: List the commits since a release tag that changed code under crates/ without changing anything under docs/, with each commit's short sha and subject. Say so when every such commit also changed the docs.
  inputs: { tag: v0.15.0 }
  reference: ref_commits_without_docs
  check: { kind: set, reference_field: commits, pattern: '\b[0-9a-f]{7,40}\b', width: 7 }
  rubric: Exactly the commits after v0.15.0 that touched crates/ but not docs/, each with its sha and subject; no commit that touched docs/ and none that left crates/ alone.

- id: silent_open_issues
  goal: For a Linear project, find the open issues (not completed, canceled or duplicates) and list the ones nobody has commented on, with their titles and links.
  inputs: { project: Embed Enhancements }
  reference: ref_silent_open_issues
  check: { kind: set, reference_field: issues, pattern: 'LN-[0-9]+' }
  rubric: Exactly the project's open issues that have no comments, each with title and link; no completed, canceled or duplicate issues and none that have comments.

- id: snippet_or_subjects
  goal: Check whether a release's changelog snippet already exists under docs/snippets/changelog/graph/<tag>; if it does, stop and say so, and otherwise return the release's commit subjects so someone can write it.
  inputs: { tag: v0.15.0 }
  reference: ref_snippet_or_subjects
  rubric: Reports that the changelog snippet for v0.15.0 already exists. Listing the subjects as well is not an error, but saying the snippet is missing is.

- id: docs_or_crates
  goal: For a pull request, summarize its documentation changes page by page if it changes anything under docs/; otherwise list the files it changes under crates/.
  inputs: { pr: 144 }
  reference: ref_docs_or_crates
  rubric: Pull request 144 changes docs/, so a page-by-page summary of its documentation changes, consistent with the docs files it changed.

- id: release_sizes
  goal: For each release tag in a list, count the commits in that release since the release before it, and return the tag, the previous tag and the count for each.
  inputs: { tags: [v0.12.0, v0.13.0, v0.14.0, v0.15.0] }
  reference: ref_release_sizes
  check: { kind: rows, reference_field: releases, key: tag, value: commits }
  rubric: One entry per tag v0.12.0, v0.13.0, v0.14.0 and v0.15.0, each with its previous release tag and the number of commits between them, matching the reference counts.
