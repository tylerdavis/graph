# exec tool: the state of one changelog entry's snippets under
# docs/snippets/changelog/<module>/<version>/ — graph/v0.13.0 for the
# binary, config/v2 and so on for a file version. Serves two callers:
# changelog_entry's never-regenerate guard
# (exists) and compose_changelog's structure decisions (has_summary /
# has_migration — the page imports snippets rather than embedding them,
# so compose needs presence, not content). The summary is validated here
# because it renders as MDX when imported: a bare { or < outside
# backticks is a JSX parse error that breaks the whole docs build — fail
# loudly with the file named instead. The migration snippet is exempt:
# it wraps its own fenced code block.
version: 1
name: snippet_status
description: >
  Whether docs/snippets/changelog/<dir>/ holds generated snippets:
  {exists, has_summary, has_migration}, where dir is the entry's
  module/version — graph/v0.13.0 for the binary, config/v2 for a file
  version. exists true means the entry was generated (and possibly
  hand-curated) — callers must not
  regenerate it. Validates the summary is MDX-safe (no bare < or {
  outside backticks), failing loudly when it is not.
kind: exec
command: bash
args:
  - "-ceuo"
  - "pipefail"
  - |
    dir="docs/snippets/changelog/$1"
    exists=false has_summary=false has_migration=false
    [ -d "$dir" ] && exists=true
    if [ -f "$dir/summary.mdx" ]; then
      if sed 's/`[^`]*`//g' "$dir/summary.mdx" | grep -q '[<{]'; then
        echo "$dir/summary.mdx contains a bare < or { outside backticks — wrap code in backticks; MDX parses bare braces as JSX" >&2
        exit 1
      fi
      has_summary=true
    fi
    [ -f "$dir/migration.mdx" ] && has_migration=true
    jq -n --argjson exists "$exists" --argjson has_summary "$has_summary" \
      --argjson has_migration "$has_migration" \
      '{exists: $exists, has_summary: $has_summary, has_migration: $has_migration}'
  - snippet_status
  - "{{input.dir}}"
output: json
timeout_secs: 10
read_only: true
input_schema:
  type: object
  required: [dir]
  properties:
    dir: { type: string, description: The entry's directory under docs/snippets/changelog/, e.g. graph/v0.10.0 or config/v2 }
output_schema:
  type: object
  properties:
    exists:        { type: boolean }
    has_summary:   { type: boolean }
    has_migration: { type: boolean }
