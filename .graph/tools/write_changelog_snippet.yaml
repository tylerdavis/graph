# exec tool (side-effecting): persist one release's inferred changelog
# front matter as docs/snippets/changelog/<version>/summary.mdx (+
# migration.mdx when migration is needed). Snippets are Mintlify
# snippets — imported by docs/changelog.mdx, never published as pages —
# so they are the single copy of this content. The migration prompt is
# wrapped in a four-backtick fence HERE so importing the snippet renders
# a copyable code block (the prompt itself may contain three-backtick
# fences). The migration conditional lives here rather than in a decide
# step — it is one branch of a single write, not control flow the plan
# needs to see.
version: 1
name: write_changelog_snippet
description: >
  Write docs/snippets/changelog/<version>/summary.mdx, plus a
  fence-wrapped migration.mdx when migration_needed is "true".
  Overwrites — callers gate on snippet_status first so curated snippets
  are never clobbered.
kind: exec
command: bash
args:
  - "-ceuo"
  - "pipefail"
  - |
    version=$1 summary=$2 needed=$3 prompt=$4
    dir="docs/snippets/changelog/$version"
    mkdir -p "$dir"
    printf '%s\n' "$summary" > "$dir/summary.mdx"
    written='["summary.mdx"]'
    if [ "$needed" = "true" ]; then
      { printf '%s\n' '````markdown'; printf '%s\n' "$prompt"; printf '%s\n' '````'; } > "$dir/migration.mdx"
      written='["summary.mdx","migration.mdx"]'
    fi
    jq -n --arg version "$version" --argjson written "$written" \
      '{version: $version, written: $written}'
  - write_changelog_snippet
  - "{{input.version}}"
  - "{{input.summary}}"
  - "{{input.migration_needed}}"
  - "{{input.migration_prompt}}"
output: json
timeout_secs: 10
read_only: false
input_schema:
  type: object
  required: [version, summary, migration_needed, migration_prompt]
  properties:
    version:          { type: string }
    summary:          { type: string }
    migration_needed: { type: boolean }
    migration_prompt: { type: string, description: Ignored unless migration_needed }
output_schema:
  type: object
  properties:
    version: { type: string }
    written: { type: array, items: { type: string } }
