# exec tool: worktree-capable variant of the github pack's git_grep
# (crates/graph-core/src/packs/github/git_grep.yaml — keep the jq shaping in
# lockstep). Empty `ref` searches the working tree's tracked files; a
# non-empty `ref` searches that committed tree. The ltrimstr on the jq side
# is a no-op for the worktree case (no ref prefix on match lines). Named
# repo_* to avoid shadowing the pack tool.
name: repo_grep
description: >
  Search tracked file contents at a git ref (POSIX extended regex), or the
  working tree when `ref` is empty, optionally scoped to pathspecs. Returns
  {matches, count, truncated} with every field always present — matches are
  {path, line, text} objects, capped at max_matches with truncated flagging
  the cut, and no match at all is {matches: [], count: 0}, not an error.
kind: exec
command: bash
args:
  - "-ceu"
  - |
    pattern="$1" ref="$2" paths="$3" max="$4"
    status=0
    grep_args=(-nIE -e "$pattern")
    [ -n "$ref" ] && grep_args+=("$ref")
    if [ -n "$paths" ]; then
      spec=()
      for p in $paths; do spec+=("$p"); done
      out=$(git grep "${grep_args[@]}" -- "${spec[@]}") || status=$?
    else
      out=$(git grep "${grep_args[@]}") || status=$?
    fi
    [ "$status" -le 1 ] || exit "$status"
    printf '%s\n' "$out" | jq -R -s --arg ref "$ref" --argjson max "$max" '
      (split("\n") | map(select(length > 0))) as $all
      | ($all[:$max]
         | map((if $ref == "" then . else ltrimstr($ref + ":") end)
               | capture("^(?<path>[^:]+):(?<line>[0-9]+):(?<text>.*)$")
               | {path, line: (.line | tonumber), text})) as $m
      | {matches: $m, count: ($m | length), truncated: (($all | length) > $max)}'
  - repo_grep
  - "{{input.pattern}}"
  - "{{input.ref}}"
  - "{{input.paths}}"
  - "{{input.max_matches}}"
output: json
timeout_secs: 30
read_only: true
input_schema:
  type: object
  required: [pattern]
  properties:
    pattern: { type: string, description: POSIX extended regex to search for }
    ref:
      type: string
      default: ""
      description: Ref or commit sha to search at; "" searches the working tree
    paths:
      type: string
      default: ""
      description: Space-separated pathspecs scoping the search; "" for everything
    max_matches:
      type: integer
      default: 200
      description: Cap on returned matches (truncated flags the cut)
output_schema:
  type: object
  properties:
    matches:
      type: array
      items:
        type: object
        properties:
          path: { type: string }
          line: { type: integer }
          text: { type: string }
    count:     { type: integer }
    truncated: { type: boolean }
