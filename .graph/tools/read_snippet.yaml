# exec tool: one release's committed changelog.d/ snippets, MDX-checked.
# The summary renders as MDX in docs/changelog.mdx, where a bare { or <
# outside backticks is a JSX parse error that breaks the whole docs
# build — so an unsafe summary fails HERE, loudly, with the file named,
# instead of surfacing as a broken Mintlify deploy. The migration prompt
# is exempt: it lands inside a fenced code block.
name: read_snippet
description: >
  The committed changelog.d/<version>/ snippets for one release —
  summary (validated MDX-safe: no bare < or { outside backticks) and
  migration prompt. Missing files are empty strings with their has_*
  flag false, not errors.
kind: exec
command: bash
args:
  - "-ceuo"
  - "pipefail"
  - |
    dir="changelog.d/$1"
    summary="" migration="" has_summary=false has_migration=false
    if [ -f "$dir/summary.md" ]; then
      if sed 's/`[^`]*`//g' "$dir/summary.md" | grep -q '[<{]'; then
        echo "$dir/summary.md contains a bare < or { outside backticks — wrap code in backticks; MDX parses bare braces as JSX" >&2
        exit 1
      fi
      summary=$(cat "$dir/summary.md")
      has_summary=true
    fi
    if [ -f "$dir/migration.md" ]; then
      migration=$(cat "$dir/migration.md")
      has_migration=true
    fi
    jq -n --arg summary "$summary" --arg migration "$migration" \
      --argjson has_summary "$has_summary" --argjson has_migration "$has_migration" \
      '{summary: $summary, has_summary: $has_summary, migration: $migration, has_migration: $has_migration}'
  - read_snippet
  - "{{input.version}}"
output: json
timeout_secs: 10
read_only: true
input_schema:
  type: object
  required: [version]
  properties:
    version: { type: string, description: Release tag, e.g. v0.10.0 }
output_schema:
  type: object
  properties:
    summary:       { type: string }
    has_summary:   { type: boolean }
    migration:     { type: string }
    has_migration: { type: boolean }
