# exec tool: one release's section of CHANGELOG.md, from the working
# tree (not git) — at release time the file has just been regenerated
# and is not yet committed. The trailing space in the needle keeps
# v0.1.0 from matching v0.10.0's heading. No section is a loud failure:
# the caller asked about a release the changelog does not know.
name: changelog_section
description: >
  The grouped commit subjects for one release, extracted from
  CHANGELOG.md's "## <version>" section. Fails when the version has no
  section — run after CHANGELOG.md is (re)generated.
kind: exec
command: bash
args:
  - "-ceuo"
  - "pipefail"
  - |
    section=$(awk -v needle="## $1 " 'index($0, needle) == 1 {found=1; next} found && /^## / {exit} found' CHANGELOG.md)
    [ -n "$section" ] || { echo "no CHANGELOG.md section for $1" >&2; exit 1; }
    jq -n --arg text "$section" '{text: $text}'
  - changelog_section
  - "{{input.version}}"
output: json
timeout_secs: 10
read_only: true
input_schema:
  type: object
  required: [version]
  properties:
    version: { type: string, description: Release tag, e.g. v0.10.0 }
output_schema:
  type: object
  properties:
    text: { type: string, description: The release's grouped commit subjects }
