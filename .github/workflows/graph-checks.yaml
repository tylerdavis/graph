# Dogfood: graph's own plans gate graph's PRs, one `graph plan run` per job.
# Jobs run inside the release container image (graph + git/jq/gh baked in),
# so there is no install step; all logic lives in the repo-carried plans
# and tools (./.graph/) and the bundled github tool pack. GRAPH_EVENTS=github
# turns failing gates into run annotations. docs-drift fails the check
# (exit 4) on undocumented behavior changes; graph-review-9000 composes
# plan__graph_review_core (the locally runnable review engine) with
# plan__graph_review_thread_audit (thread lifecycle, decide-gated to runs
# with prior findings), maintaining its eight-pass findings as living
# review threads (new findings post, fixed ones resolve with a reply,
# human-dismissed ones stay declined) plus a marker-keyed summary comment
# refreshed in place on every push.
name: graph checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  packages: read                   # pull the (private) release image

concurrency:
  group: graph-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GRAPH_STORAGE: memory            # ephemeral: leave no state behind in CI
  GRAPH_EVENTS: github             # failing plans annotate the run
  GH_TOKEN: ${{ github.token }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PR: ${{ github.event.pull_request.number }}
  BASE: ${{ github.event.pull_request.base.sha }}
  HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  docs-drift:
    # Drafts pay nothing; fork PRs have no ANTHROPIC_API_KEY (the ${VAR} in
    # .graph/config.toml hard-errors without it — that's the backstop).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/tylerdavis/graph:v0.12.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the plan diffs $BASE...$HEAD locally

      - name: Docs drift gate
        run: graph plan run docs_drift --input base="$BASE" --input head="$HEAD"

  # The reviewer: graph_review_9000 wraps plan__graph_review_core (the
  # engine, also runnable locally over a worktree) and
  # plan__graph_review_thread_audit (thread transitions). Needs >= v0.11.0:
  # the plans read and sync findings as review threads via
  # gh_pr_review_threads / gh_pr_thread_sync,
  # which earlier images don't ship. The plan run authenticates as the
  # review App (see cookbook/bot-identity): the default Actions token
  # cannot run the review-thread GraphQL mutations (resolveReviewThread /
  # addPullRequestReviewThreadReply return "Resource not accessible by
  # integration" even with pull-requests: write), so without the App
  # token the plan's resolve/decline transitions silently no-op.
  graph-review-9000:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/tylerdavis/graph:v0.12.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the plan reads files at $HEAD via git_file

      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ secrets.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_KEY }}

      - name: Deep review and comment
        run: graph plan run graph_review_9000 --input pr="$PR"
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}   # the App, not github.token
