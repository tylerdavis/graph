# The drafting overlay: two steps accepted, the third being drafted, the
# outline's remaining stage pending. Used in using/plan-workbench.mdx's
# drafting section.
name: drafting-overlay
title: graph workbench — drafting a plan
grid: { cols: 120, rows: 36 }

chat: "draft a plan that reviews a PR and posts findings as comments"

llm:
  # The orchestrator drafts the new plan with the built-in author_plan
  # plan: the outliner's entries (structured), the review (answered
  # below), then one structured step draft per stage — the capture fires
  # while stage 3 is being drafted.
  - call: plan__author_plan
    input:
      goal: >-
        Review a pull request against the repo rubric and post the
        findings as inline comments
  - structured:
      entries:
        - Identify the pull request and the commits it spans
        - Collect the full change set for review
        - Review the changes against the repo rubric
        - Post each finding as an inline comment
  - structured:
      step:
        id: E0
        toolName: builtin__gh_pr_meta
        input: { pr: 61 }
        reasoning: Title, body, and the shas to diff.
      planComplete: false
  - structured:
      step:
        id: E1
        toolName: builtin__git_diff
        input:
          base: "{{E0.base_sha}}"
          head: "{{E0.head_sha}}"
          paths: "."
          exclude: "Cargo.lock"
          max_bytes: 200000
        reasoning: The full change, within token budget.
      planComplete: false

# The outline review, approved as drafted.
answers:
  - { approve: true, changes: "" }

capture:
  draft_step: 2
  turn_seconds: 6
